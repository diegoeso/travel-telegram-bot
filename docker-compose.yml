services:
  bot:
    build: .
    container_name: travel-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: travel-bot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bot-network

volumes:
  redis-data:

networks:
  bot-network:
    driver: bridge
